<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnyDown</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      /* The panel is normally 380px wide; the preview pins it so screenshots
         match what the browser side panel actually shows. */
      body { width: 380px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1 class="mark">Any<span class="mark__tail">Down</span></h1>
        <button class="icon-button" id="open-options" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="2.4" />
            <path d="M8 1.2v2M8 12.8v2M1.2 8h2M12.8 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4" />
          </svg>
        </button>
      </header>

      <div class="context">
        <span class="tally" id="tally" data-live="false" aria-hidden="true"></span>
        <span class="context__title" id="context-title">Reading this tab…</span>
      </div>

      <nav class="tabs" aria-label="Panel sections">
        <button class="tab is-active" type="button" data-view="detected" aria-current="page">
          Detected<span class="tab__count" id="detected-count" hidden></span>
        </button>
        <button class="tab" type="button" data-view="history">History</button>
      </nav>

      <main class="views">
        <section class="view" id="view-detected">
          <ul class="stack" id="media-list"></ul>
          <div class="empty" id="detected-empty">
            <p class="empty__head">Nothing detected yet</p>
            <p class="empty__body">Start playing the video on this page and it will show up here.</p>
          </div>
        </section>

        <section class="view" id="view-history" hidden>
          <ul class="stack" id="history-list"></ul>
          <div class="empty" id="history-empty">
            <p class="empty__head">No downloads yet</p>
            <p class="empty__body">Finished files are listed here.</p>
          </div>
          <div class="history-foot" id="history-foot" hidden>
            <button class="button button--ghost" type="button" id="clear-history">Clear history</button>
          </div>
        </section>
      </main>
    </div>

    <template id="tpl-card">
      <li class="card">
        <div class="card__rail"><span class="kind"></span></div>

        <div class="card__body">
          <p class="card__title"></p>
          <p class="card__meta"></p>

          <div class="card__actions">
            <button class="button button--primary js-download" type="button">Download</button>
          </div>

          <div class="picker" hidden>
            <p class="picker__label">Choose a quality</p>
            <ul class="picker__list"></ul>
          </div>

          <div class="run" hidden>
            <div class="run__head">
              <span class="run__state js-state"></span>
              <span class="run__pct js-pct"></span>
              <button class="icon-button icon-button--tight js-cancel" type="button" title="Cancel" aria-label="Cancel download">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M4 4l8 8M12 4l-8 8" />
                </svg>
              </button>
            </div>
            <p class="run__stats">
              <span class="js-count"></span>
              <span class="js-speed"></span>
              <span class="js-eta"></span>
            </p>
          </div>

          <p class="note" hidden></p>
        </div>

        <div class="ribbon" hidden aria-hidden="true"></div>
      </li>
    </template>

    <template id="tpl-history">
      <li class="row">
        <div class="row__body">
          <p class="row__title"></p>
          <p class="row__meta"></p>
        </div>
        <div class="row__actions">
          <button class="button button--ghost js-show" type="button">Show</button>
          <button class="icon-button icon-button--tight js-forget" type="button" title="Remove from list" aria-label="Remove from list">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </div>
      </li>
    </template>

    <template id="tpl-variant">
      <li>
        <button class="variant js-variant" type="button">
          <span class="variant__height"></span>
          <span class="variant__rate"></span>
          <span class="variant__codec"></span>
        </button>
      </li>
    </template>

    <script src="preview-stub.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
