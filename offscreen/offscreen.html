<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnyDown engine</title>
  </head>
  <body>
    <!--
      Never visible. This document exists because MV3 service workers are
      terminated while idle and cannot call URL.createObjectURL, so the
      segment pool and the final Blob assembly have to live somewhere with a
      full DOM environment and a longer lifetime.
    -->
    <!--
      mp4box.js, loaded as a classic script so its UMD build attaches to the
      global before the module runs. It is only reached when a stream carries
      its audio as a separate rendition and both sides are fragmented MP4.
    -->
    <script src="../vendor/mp4box.js"></script>
    <script type="module" src="offscreen.js"></script>
  </body>
</html>
